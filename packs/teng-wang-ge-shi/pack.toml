[poem]
title = "滕王阁诗"
author = "王勃"
dynasty = "唐"
lines = ["滕王高阁临江渚", "佩玉鸣鸾罢歌舞", "画栋朝飞南浦云", "珠帘暮卷西山雨", "闲云潭影日悠悠", "物换星移几度秋", "阁中帝子今何在", "槛外长江空自流"]
source = "《全唐诗》"

