[package]
name = "muse"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
muse-core = { version = "0.1.0", path = "../muse-core" }
muse-render = { version = "0.1.0", path = "../muse-render" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.3"
rmcp = { version = "3.11.0", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "io-std"] }
toml = "1.2.2"
raw-window-handle = "0.6.2"
wgpu = "30.0.2"
winit = "0.30.13"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["event", "fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["system"] }
wayland-client = "0.31.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
tray-icon = "0.26.1"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
